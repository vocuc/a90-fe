<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ghép 2 ảnh dọc</title>
    <style>
        :root {
            --bg: #1c1a17;
            --panel: #26231f;
            --card: #2f2b26;
            --line: #3d3833;
            --text: #f2ede4;
            --muted: #a89e8f;
            --accent: #d9b26a;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px 16px 60px;
            min-height: 100vh;
            padding-top: calc(24px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 4px;
            letter-spacing: .2px
        }

        p.sub {
            color: var(--muted);
            font-size: 13px;
            margin: 0 0 24px
        }

        .wrap {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px
        }

        @media(max-width:800px) {
            .wrap {
                grid-template-columns: 1fr
            }
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px
        }

        .dropGrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 20px
        }

        .drop {
            border: 1.5px dashed var(--line);
            border-radius: 8px;
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: border-color .15s;
            aspect-ratio: 597/1650;
        }

        .drop:hover,
        .drop.drag {
            border-color: var(--accent)
        }

        .drop img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .9
        }

        .drop .cap {
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 2;
            font-size: 10px;
            letter-spacing: .4px;
            text-transform: uppercase;
            color: var(--text);
            background: rgba(0, 0, 0, .45);
            padding: 3px 7px;
            border-radius: 5px;
            pointer-events: none;
        }

        .drop .hint {
            font-size: 26px;
            color: var(--muted);
            position: relative;
            z-index: 1;
            pointer-events: none;
            line-height: 1
        }

        .drop img~.hint {
            display: none
        }

        .zoomRow {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px
        }

        .zoomRow .zoomLabel {
            font-size: 11px;
            color: var(--muted);
            width: 66px;
            flex-shrink: 0
        }

        .zoomRow input[type=range] {
            flex: 1;
            accent-color: var(--accent)
        }

        .zoomRow span.zoomVal {
            font-size: 11px;
            color: var(--muted);
            width: 36px;
            text-align: right;
            flex-shrink: 0
        }

        input[type=file] {
            display: none
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 9px;
            border: none;
            background: var(--accent);
            color: #231d12;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        .canvasBox {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
            touch-action: none;
            cursor: grab
        }

        canvas:active {
            cursor: grabbing
        }

        .ratioLabel {
            font-size: 11px;
            color: var(--muted);
            margin: 0 0 8px;
            text-transform: uppercase;
            letter-spacing: .4px
        }

        .ratioRow {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px
        }

        .chip {
            padding: 6px 11px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
        }

        .chip:hover {
            border-color: var(--accent)
        }

        .chip.on {
            background: var(--accent);
            border-color: var(--accent);
            color: #231d12;
            font-weight: 700
        }

        .note {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.5
        }
    </style>
</head>

<body>
    @include('landing.theme1.manager.tools.menu')
    <div class="wrap">
        <div class="panel">
            <div class="ratioLabel">Tỷ lệ khung hình</div>
            <div class="ratioRow" id="ratioRow"></div>
            <div class="dropGrid">
                <div class="drop" data-slot="left"><span class="cap">Ảnh trái</span><span class="hint">+</span></div>
                <div class="drop" data-slot="right"><span class="cap">Ảnh phải</span><span class="hint">+</span></div>
            </div>
            <div class="zoomRow"><span class="zoomLabel">Ảnh trái</span><input type="range" data-slot="left" min="1" max="3" step="0.05" value="1" disabled><span class="zoomVal">1.0x</span></div>
            <div class="zoomRow"><span class="zoomLabel">Ảnh phải</span><input type="range" data-slot="right" min="1" max="3" step="0.05" value="1" disabled><span class="zoomVal">1.0x</span></div>
            <button class="btn" id="downloadBtn" disabled>Tải ảnh kết quả (PNG)</button>
            <div class="note">Kéo trực tiếp trên vùng ảnh trong khung lớn để chỉnh phần muốn hiển thị, dùng thanh trượt để zoom in/out.</div>
        </div>

        <div class="canvasBox">
            <canvas id="cv" width="1200" height="1650"></canvas>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*">

    <script>
        const GAP = 6;
        let W = 1200,
            H = 1650;
        const RATIOS = [{
                label: '8:11',
                w: 8,
                h: 11
            },
            {
                label: '2:3',
                w: 2,
                h: 3
            },
            {
                label: '3:4',
                w: 3,
                h: 4
            },
            {
                label: '4:5',
                w: 4,
                h: 5
            },
            {
                label: '9:16',
                w: 9,
                h: 16
            },
            {
                label: '1:1',
                w: 1,
                h: 1
            },
            {
                label: '4:3',
                w: 4,
                h: 3
            },
            {
                label: '16:9',
                w: 16,
                h: 9
            }
        ];
        const SLOTS = ['left', 'right'];
        const imgs = {
            left: null,
            right: null
        };
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');
        let activeSlot = null;

        function layout() {
            const colW = (W - GAP) / 2;
            return {
                left: {
                    x: 0,
                    y: 0,
                    w: colW,
                    h: H
                },
                right: {
                    x: colW + GAP,
                    y: 0,
                    w: W - (colW + GAP),
                    h: H
                }
            };
        }

        function clamp(v, min, max) {
            return Math.min(max, Math.max(min, v));
        }

        function getCrop(state, w, h) {
            const image = state.image;
            const ir = image.width / image.height;
            const br = w / h;
            let baseSw, baseSh;
            if (ir > br) {
                baseSh = image.height;
                baseSw = baseSh * br;
            } else {
                baseSw = image.width;
                baseSh = baseSw / br;
            }
            const sw = baseSw / state.scale;
            const sh = baseSh / state.scale;
            if (state.sx === undefined) {
                state.sx = (image.width - sw) / 2;
                state.sy = (image.height - sh) / 2;
            } else if (state.lastSw !== undefined) {
                const cx = state.sx + state.lastSw / 2;
                const cy = state.sy + state.lastSh / 2;
                state.sx = cx - sw / 2;
                state.sy = cy - sh / 2;
            }
            state.sx = clamp(state.sx, 0, Math.max(0, image.width - sw));
            state.sy = clamp(state.sy, 0, Math.max(0, image.height - sh));
            state.lastSw = sw;
            state.lastSh = sh;
            return {
                sx: state.sx,
                sy: state.sy,
                sw,
                sh
            };
        }

        function drawSlot(slot, box) {
            const state = imgs[slot];
            if (!state) return;
            const {
                sx,
                sy,
                sw,
                sh
            } = getCrop(state, box.w, box.h);
            ctx.drawImage(state.image, sx, sy, sw, sh, box.x, box.y, box.w, box.h);
        }

        function render() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, W, H);
            const L = layout();
            SLOTS.forEach(s => drawSlot(s, L[s]));
            downloadBtn.disabled = !SLOTS.every(s => imgs[s]);
        }

        // --- upload handling ---
        document.querySelectorAll('.drop').forEach(drop => {
            const slot = drop.dataset.slot;
            drop.addEventListener('click', () => {
                activeSlot = slot;
                document.getElementById('fileInput').click();
            });
            ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => {
                e.preventDefault();
                drop.classList.add('drag');
            }));
            ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
                e.preventDefault();
                drop.classList.remove('drag');
            }));
            drop.addEventListener('drop', e => {
                const f = e.dataTransfer.files[0];
                if (f) loadImage(f, slot, drop);
            });
        });

        document.getElementById('fileInput').addEventListener('change', e => {
            const f = e.target.files[0];
            const drop = document.querySelector(`.drop[data-slot="${activeSlot}"]`);
            if (f) loadImage(f, activeSlot, drop);
            e.target.value = '';
        });

        function loadImage(file, slot, dropEl) {
            const reader = new FileReader();
            reader.onload = e => {
                const im = new Image();
                im.onload = () => {
                    imgs[slot] = {
                        image: im,
                        scale: 1,
                        sx: undefined,
                        sy: undefined
                    };
                    let thumb = dropEl.querySelector('img');
                    if (!thumb) {
                        thumb = document.createElement('img');
                        dropEl.prepend(thumb);
                    }
                    thumb.src = e.target.result;
                    const slider = document.querySelector(`input[type=range][data-slot="${slot}"]`);
                    slider.disabled = false;
                    slider.value = 1;
                    slider.nextElementSibling.textContent = '1.0x';
                    render();
                };
                im.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- zoom sliders ---
        document.querySelectorAll('input[type=range]').forEach(slider => {
            slider.addEventListener('input', () => {
                const state = imgs[slider.dataset.slot];
                if (!state) return;
                state.scale = parseFloat(slider.value);
                slider.nextElementSibling.textContent = state.scale.toFixed(2) + 'x';
                render();
            });
        });

        // --- drag to pan on canvas ---
        let dragging = null;

        function canvasPoint(e) {
            const rect = cv.getBoundingClientRect();
            const scaleX = cv.width / rect.width;
            const scaleY = cv.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function findSlotAt(x, y) {
            const L = layout();
            for (const slot of SLOTS) {
                const b = L[slot];
                if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h && imgs[slot]) return {
                    slot,
                    box: b
                };
            }
            return null;
        }

        function startDrag(e) {
            const p = canvasPoint(e);
            const hit = findSlotAt(p.x, p.y);
            if (!hit) return;
            e.preventDefault();
            dragging = {
                ...hit,
                lastX: p.x,
                lastY: p.y
            };
        }

        function moveDrag(e) {
            if (!dragging) return;
            e.preventDefault();
            const p = canvasPoint(e);
            const dx = p.x - dragging.lastX;
            const dy = p.y - dragging.lastY;
            dragging.lastX = p.x;
            dragging.lastY = p.y;
            const state = imgs[dragging.slot];
            const box = dragging.box;
            if (state.lastSw === undefined) return;
            state.sx = clamp(state.sx - dx * (state.lastSw / box.w), 0, Math.max(0, state.image.width - state.lastSw));
            state.sy = clamp(state.sy - dy * (state.lastSh / box.h), 0, Math.max(0, state.image.height - state.lastSh));
            render();
        }

        function endDrag() {
            dragging = null;
        }

        cv.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', endDrag);
        cv.addEventListener('touchstart', startDrag, {
            passive: false
        });
        window.addEventListener('touchmove', moveDrag, {
            passive: false
        });
        window.addEventListener('touchend', endDrag);

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const timestamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
            link.download = `anh-ghep-${timestamp}.png`;
            link.href = cv.toDataURL('image/png');
            link.click();
        });

        // --- aspect ratio ---
        const ratioRow = document.getElementById('ratioRow');

        function setRatio(r, btn) {
            W = 1200;
            H = Math.round(W * r.h / r.w);
            cv.width = W;
            cv.height = H;
            const colW = (W - GAP) / 2;
            document.querySelectorAll('.drop').forEach(d => d.style.aspectRatio = colW + '/' + H);
            ratioRow.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === btn));
            render();
        }
        RATIOS.forEach((r, i) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'chip';
            b.textContent = r.label;
            b.addEventListener('click', () => setRatio(r, b));
            ratioRow.appendChild(b);
            if (r.label === '9:16') setRatio(r, b);
        });

        render();
    </script>
</body>

</html>
